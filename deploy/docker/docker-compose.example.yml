# Minimal mcsm container — env-driven config (see .env.example).
# Copy this file to docker-compose.yml and .env.example to .env, then edit .env.
#
# For multi-slot setups: skip the .env approach and mount your own
# config.yaml at /etc/mcsm/config.yaml (the entrypoint respects it).

services:
  mcsm:
    image: mcsm:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: "2.0.0-dev"
    container_name: mcsm
    restart: unless-stopped

    # All MCSM_* settings come from .env. The container's entrypoint
    # turns them into /etc/mcsm/config.yaml at startup (and hashes the
    # plaintext token with mcsm-tokens before writing).
    env_file:
      - .env
    environment:
      TZ: "Europe/Berlin"

    ports:
      - "8124:8124"
      # Re-expose the slot port using whatever you set in .env.
      - "${MCSM_SLOT_PORT:-25565}:${MCSM_SLOT_PORT:-25565}"

    volumes:
      # Persist audit log + heartbeats. (Comment out if ephemeral is fine.)
      - ./data:/var/lib/mcsm
      # Your Minecraft server folders. Adjust the host path.
      - /mnt/servers:/mnt/servers

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
